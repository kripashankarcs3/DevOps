name: Ordered Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print setup confirmation
        run: echo "Setup done"

      - name: Fail deliberately
        run: exit 1

  verify:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Check out repository again
        uses: actions/checkout@v4

      - name: Print Python version
        run: python --version

      - name: Print verify confirmation
        run: echo "Verify done"

  finish:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Print completion
        run: echo "Pipeline finished"
