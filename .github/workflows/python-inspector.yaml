name: Python Inspector

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print Python and pip versions
        run: |
          python --version
          pip --version

      - name: Show python binary path
        run: which python

      - name: Complete inspection
        run: echo "Inspection complete"
