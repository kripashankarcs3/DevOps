name: Release Train

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVICE_NAME: release-train-service

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Print Node details
        run: |
          node --version
          npm --version
          which node

  package:
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      release_ref: ${{ steps.release-meta.outputs.release_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release reference
        id: release-meta
        run: |
          echo "RELEASE_REF=${SERVICE_NAME}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "release_ref=${SERVICE_NAME}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq tree

      - name: Create release folder
        run: |
          mkdir -p release
          build_time_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          {
            echo "deployment_target=${{ vars.DEPLOYMENT_TARGET }}"
            echo "build_ref=${GITHUB_REF}"
            echo "event_name=${GITHUB_EVENT_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "build_time_utc=${build_time_utc}"
          } > "release/${RELEASE_REF}"
          cp package.json release/

      - name: Write release manifest
        run: |
          build_time_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > release/manifest.json <<EOF
          {
            "release_ref": "${RELEASE_REF}",
            "service_name": "${SERVICE_NAME}",
            "deployment_target": "${{ vars.DEPLOYMENT_TARGET }}",
            "build_ref": "${GITHUB_REF}",
            "event_name": "${GITHUB_EVENT_NAME}",
            "actor": "${GITHUB_ACTOR}",
            "build_time_utc": "${build_time_utc}"
          }
          EOF

      - name: Prove manifest parses
        run: jq -r '.deployment_target' release/manifest.json

      - name: Show release structure
        run: tree -L 2 release

  announce:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Announce release reference
        run: echo "Release reference: ${{ needs.package.outputs.release_ref }}"

      - name: Announce deployment target
        run: echo "Deployment target: ${{ vars.DEPLOYMENT_TARGET }}"

      - name: Announce service name
        run: echo "Service name: ${SERVICE_NAME}"

      - name: Announce pull request candidate
        if: github.event_name == 'pull_request'
        run: echo "Announcing a release candidate from a pull request."

      - name: Announce push release
        if: github.event_name == 'push'
        run: echo "Announcing a release from main."

      - name: Announce manual run
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual release train run."

      - name: Complete
        run: echo "Release train complete"
